services:
  - type: web
    name: focusflow-app
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Option A: full Atlas URI (must match Atlas Connect → Drivers exactly)
      - key: MONGODB_URI
        sync: false
      # Option B: split vars (password auto URL-encoded; overrides MONGODB_URI when all three are set)
      - key: MONGODB_USER
        sync: false
      - key: MONGODB_PASSWORD
        sync: false
      - key: MONGODB_HOST
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: JWT_REFRESH_EXPIRE
        value: 30d
